name: Deploy to QA Sandbox

on:
  push:
    branches:
      - develop

jobs:
  deploy-qa:
    name: Deploy → QA Sandbox
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Write SFDX Auth URL
        run: |
          echo "${{ secrets.SF_QA_AUTH_URL }}" > /tmp/auth.txt
          chmod 600 /tmp/auth.txt

      - name: Authenticate QA Sandbox
        run: |
          sf org login sfdx-url \
            --sfdx-url-file /tmp/auth.txt \
            --alias QASandbox

      - name: Verify Authentication
        run: |
          sf org display --target-org QASandbox

      - name: Deploy to QA
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org QASandbox \
            --test-level RunSpecifiedTests \
            --tests AccountServiceTest \
            --wait 30

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/auth.txt