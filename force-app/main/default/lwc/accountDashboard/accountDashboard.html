<template>
    <lightning-card title="Account Dashboard" icon-name="standard:account">
        <div class="slds-m-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading accounts..." size="medium"></lightning-spinner>
            </template>

            <template if:false={isLoading}>
                <template if:true={error}>
                    <p class="slds-text-color_error">{error}</p>
                </template>

                <template if:false={error}>
                    <template for:each={accounts} for:item="account">
                        <div key={account.Id} class="account-card slds-m-bottom_small">
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                <span class="slds-text-heading_small">{account.Name}</span>
                                <lightning-badge
                                    label={account.AccountTier__c}
                                    class={account.tierClass}>
                                </lightning-badge>
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak">
                                {account.Industry} · {account.Phone}
                            </p>
                            <ul class="contact-list slds-m-top_x-small">
                                <template for:each={account.Contacts} for:item="contact">
                                    <li key={contact.Id} class="slds-text-body_small">
                                        {contact.FirstName} {contact.LastName}
                                        <span class="score-badge">Score: {contact.PriorityScore__c}</span>
                                    </li>
                                </template>
                            </ul>
                            <div class="slds-m-top_small">
                                <lightning-combobox
                                    label="Change Tier"
                                    value={account.AccountTier__c}
                                    options={tierOptions}
                                    data-account-id={account.Id}
                                    onchange={handleTierChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </template>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
